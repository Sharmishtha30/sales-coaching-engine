[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-coaching-engine"
version = "0.1.0"
description = "Self-hosted, evidence-linked sales coaching with HTTP and MCP interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "mcp>=1.12,<2", "python-multipart>=0.0.20", "pydantic>=2.10,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24"]

[project.scripts]
sales-coach = "sales_coach.cli:main"
sales-coach-mcp = "sales_coach.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
